<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' data: blob:;">
  <title>净播 PureLive</title>
  <link rel="stylesheet" href="player.css">
</head>
<body>
  <header class="player-bar">
    <div class="bar-left">
      <button class="icon-btn back-btn" id="backBtn" type="button" title="返回直播架" aria-label="返回直播架">
        <svg viewBox="0 0 20 20" fill="none"><path d="M11.8 4.8 6.6 10l5.2 5.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="identity">
        <div class="platform-mark" id="platformMark">B</div>
        <div class="identity-copy">
          <div class="room-title-line">
            <h1 id="roomTitle">正在打开直播间</h1>
            <span class="mode-pill" id="modePill">纯净</span>
          </div>
          <p id="roomHost">PURELIVE</p>
        </div>
      </div>
    </div>

    <div class="bar-controls">
      <button class="icon-btn" id="playBtn" type="button" title="播放 / 暂停（空格）" aria-label="播放或暂停">
        <svg class="icon-play" viewBox="0 0 20 20" fill="none"><path d="M7.2 5.3c0-.8.9-1.3 1.6-.9l6.2 3.8c.7.4.7 1.3 0 1.7l-6.2 3.8c-.7.4-1.6-.1-1.6-.9V5.3Z" fill="currentColor"/></svg>
        <svg class="icon-pause" viewBox="0 0 20 20" fill="none"><rect x="6.2" y="5.1" width="2.6" height="9.8" rx="1" fill="currentColor"/><rect x="11.2" y="5.1" width="2.6" height="9.8" rx="1" fill="currentColor"/></svg>
      </button>
      <button class="icon-btn" id="muteBtn" type="button" title="静音（M）" aria-label="静音">
        <svg class="icon-volume" viewBox="0 0 20 20" fill="none"><path d="M4 7.8v4.4h2.6L10 15V5L6.6 7.8H4Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M12.6 7.4c.9.8 1.4 1.7 1.4 2.6 0 1-.5 1.9-1.4 2.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M14.7 5.2c1.5 1.3 2.3 2.9 2.3 4.8 0 1.9-.8 3.5-2.3 4.8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <svg class="icon-muted" viewBox="0 0 20 20" fill="none"><path d="M4 7.8v4.4h2.6L10 15V5L6.6 7.8H4Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="m12.5 7.7 4.2 4.6M16.7 7.7l-4.2 4.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      </button>

      <button class="quality-btn" id="qualityBtn" type="button" title="调整清晰度" aria-haspopup="listbox" aria-expanded="false">
        <svg viewBox="0 0 20 20" fill="none"><path d="M4 6.2h7M13.8 6.2H16M4 13.8h2.2M9 13.8h7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="12" cy="6.2" r="1.7" stroke="currentColor" stroke-width="1.3"/><circle cx="7.2" cy="13.8" r="1.7" stroke="currentColor" stroke-width="1.3"/></svg>
        <span class="quality-name">画质</span>
        <span class="quality-value" id="qualityValue">自动</span>
        <svg class="quality-chevron" viewBox="0 0 20 20" fill="none"><path d="m6.4 8.2 3.6 3.6 3.6-3.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <button class="enhance-btn" id="enhanceBtn" type="button" title="实时画质增强（GPU）">
        <svg viewBox="0 0 20 20" fill="none"><path d="M10 2.8 11.6 7l4.2 1.6-4.2 1.6L10 14.4 8.4 10.2 4.2 8.6 8.4 7 10 2.8Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M15.4 12.6l.7 1.7 1.7.7-1.7.7-.7 1.7-.7-1.7-1.7-.7 1.7-.7.7-1.7Z" fill="currentColor"/></svg>
        <span>增强</span>
      </button>

      <button class="clean-toggle is-on" id="cleanBtn" type="button" role="switch" aria-checked="true" title="切换纯净模式">
        <span class="clean-dot"></span>
        <span class="clean-label">纯净</span>
        <span class="clean-track"><span></span></span>
      </button>

      <span class="control-sep"></span>

      <button class="icon-btn" id="reloadBtn" type="button" title="刷新画面" aria-label="刷新画面">
        <svg viewBox="0 0 20 20" fill="none"><path d="M15.5 8.2A5.8 5.8 0 1 0 15 12.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M15.6 4.6v3.9h-3.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="pinBtn" type="button" title="窗口置顶" aria-label="窗口置顶">
        <svg viewBox="0 0 20 20" fill="none"><path d="M7.1 3.8h5.8l-.6 4.1 2.4 2.4v1.2H5.3v-1.2l2.4-2.4-.6-4.1Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M10 11.5v4.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" id="fullscreenBtn" type="button" title="全屏（F11）" aria-label="全屏">
        <svg viewBox="0 0 20 20" fill="none"><path d="M7.4 3.8H3.8v3.6M12.6 3.8h3.6v3.6M7.4 16.2H3.8v-3.6M12.6 16.2h3.6v-3.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="icon-btn" id="moreBtn" type="button" title="更多" aria-label="更多">
        <svg viewBox="0 0 20 20" fill="currentColor"><circle cx="5" cy="10" r="1.3"/><circle cx="10" cy="10" r="1.3"/><circle cx="15" cy="10" r="1.3"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="ambient ambient-a"></div>
    <div class="ambient ambient-b"></div>

    <div class="stage-loading" id="loadingView">
      <div class="loader-orb" id="loaderOrb">
        <span class="orb-ring"></span>
        <span class="orb-ring orb-ring-2"></span>
        <span class="orb-core" id="loaderMark">B</span>
      </div>
      <div class="loading-kicker">CONNECTING TO LIVE</div>
      <h2>正在接通画面</h2>
      <p id="loadingText">正在移开聊天、礼物与推荐，只留下直播本身。</p>
      <div class="loading-track"><span></span></div>
      <div class="loading-shortcuts">F11 全屏 · 空格 暂停 · M 静音</div>
    </div>

    <div class="stage-error" id="errorView" hidden>
      <div class="error-mark">
        <svg viewBox="0 0 30 30" fill="none"><rect x="3.8" y="5.6" width="22.4" height="16.2" rx="3" stroke="currentColor" stroke-width="1.6"/><path d="M10.2 26h9.6M15 21.8V26" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="m12.2 11.6 5.6 4.2-5.6 4.2v-8.4Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </div>
      <div class="error-kicker">SIGNAL LOST</div>
      <h2 id="errorTitle">画面暂时没有接通</h2>
      <p id="errorText">请检查网络后重试。</p>
      <div class="error-actions">
        <button class="btn btn-primary" id="retryBtn" type="button">重新连接</button>
        <button class="btn btn-ghost" id="webModeBtn" type="button">切换到网页模式</button>
      </div>
      <div class="error-note" id="errorNote">网页模式会显示直播站点完整界面，适合登录或调整画质。</div>
    </div>

    <div class="stage-hint" id="stageHint">
      <span class="hint-dot"></span>
      画面区域已净化 · 聊天 / 礼物 / 推荐不会出现
    </div>
  </main>

  <div class="quality-menu" id="qualityMenu" hidden>
    <div class="quality-head">
      <span>清晰度</span>
      <span class="quality-platform" id="qualityPlatform">直播间</span>
    </div>
    <div class="quality-options" id="qualityOptions" role="listbox" aria-label="清晰度"></div>
    <div class="quality-note" id="qualityNote" hidden></div>
    <div class="quality-foot">
      <span>更高画质通常需要登录</span>
      <button type="button" id="qualityWeb">网页模式</button>
    </div>
  </div>

  <div class="player-menu" id="playerMenu" hidden>
    <button type="button" data-action="copy">
      <svg viewBox="0 0 20 20" fill="none"><rect x="6.3" y="5.4" width="8.1" height="10.6" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M8.1 5.4V4.2c0-.6.4-1 1-1h1.8c.6 0 1 .4 1 1v1.2" stroke="currentColor" stroke-width="1.3"/></svg>
      复制直播间链接
    </button>
    <button type="button" data-action="external">
      <svg viewBox="0 0 20 20" fill="none"><path d="M11.2 4.2h4.6v4.6M15.8 4.2l-6.6 6.6" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/><path d="M8.4 4.9H5.5c-.8 0-1.3.5-1.3 1.3v8.3c0 .8.5 1.3 1.3 1.3h8.3c.8 0 1.3-.5 1.3-1.3v-2.9" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg>
      在浏览器打开
    </button>
    <button type="button" data-action="home">
      <svg viewBox="0 0 20 20" fill="none"><path d="M4.1 9.1 10 4.2l5.9 4.9v6.2c0 .5-.4.9-.9.9h-3.2v-4H8.2v4H5c-.5 0-.9-.4-.9-.9V9.1Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/></svg>
      回到直播间首页
    </button>
    <div class="menu-sep"></div>
    <button type="button" data-action="close" class="danger">
      <svg viewBox="0 0 20 20" fill="none"><path d="m6 6 8 8M14 6l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      关闭播放窗口
    </button>
  </div>

  <div class="toast" id="toast" hidden><span></span><span id="toastText"></span></div>

  <script src="player.js"></script>
</body>
</html>
